name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: shani-cassini-ci
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      language: all
      python-version: "3.12"

  test:
    name: Test
    uses: shani8dev/shani-ci-commons/.github/workflows/test.yml@main
    with:
      language: python
      test-command: |
        # httpx2 (declared in pyproject) does not ship an `httpx` module;
        # the codebase still does `import httpx`, so the alias shim in
        # src/shani_cassini/_httpx_compat.py must run first or pytest silently
        # falls back to any legacy httpx on the runner.
        python3 -c "import shani_cassini._httpx_compat"
        # GTK4 windows need a display: headless, test_application segfaults
        xvfb-run -a python3 -m pytest tests/ -v
      python-version: "3.12"
      apt-packages: python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin xvfb
      system-site-packages: true
    needs: lint

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: lint