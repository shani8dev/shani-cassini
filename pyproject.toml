[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shani-cassini"
version = "0.1.0"
description = "Native GUI Client for Shanios"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Shanios Developers"}
]
keywords = ["shanios", "gui", "gtk", "system-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyGObject>=3.42.0",
    "httpx2>=0.18.0",
    "keyring>=24.2.0",
]
# NOTE: the codebase still writes `import httpx` everywhere, but httpx2 does
# NOT provide an `httpx` module — it ships `httpx2` plus an opt-in
# `httpx2.alias_httpx()` that re-exports the API under the `httpx` name.
# `src/shani_cassini/_httpx_compat.py` runs that alias at import time so every
# `import httpx` resolves to httpx2. Without it, a clean install (httpx2
# only) dies with `ModuleNotFoundError: No module named 'httpx'`.

[project.urls]
Homepage = "https://github.com/shani8dev/shani-cassini"
Documentation = "https://github.com/shani8dev/shani-cassini/wiki"
Repository = "https://github.com/shani8dev/shani-cassini"

[project.scripts]
shani-cassini = "shani_cassini.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shani_cassini*"]

[tool.setuptools.package-data]
shani_cassini = [
    "assets/*",
    "tabs/*",
]

[tool.setuptools]
zip-safe = false
[tool.commitizen]
version = "0.0.0"
version_scheme = "semver"
update_changelog_on_bump = true
tag_format = "v$version"
allow_abort_on_fail = false
allow_dirty = false
name = "cz_conventional_commits"
